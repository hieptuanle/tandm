[workspace]
resolver = "3"
members = ["crates/tandm-core", "crates/tandm-gui", "crates/tandm"]
default-members = ["crates/tandm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Hiep Le"]

[workspace.dependencies]
tandm-core = { path = "crates/tandm-core" }
tandm-gui = { path = "crates/tandm-gui" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
gpui = "=0.2.2"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4

[profile.dev]
# GPUI is slow unoptimised; keep our own crates debuggable.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
